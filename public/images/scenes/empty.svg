<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" role="img" aria-label="Nothing here yet: a blank wall">
<!-- Empty state (short, ~5s then still): a climber at the base of a blank,
     unclimbed wall looks up and along it, shrugs, and waits — nothing here
     yet. climbing.ge scene set. -->
<style>
  .head { animation: look 2.6s ease-in-out 2 both; transform-box: fill-box; transform-origin: 50% 100%; }
  .shrug { animation: shrug .9s 4.6s ease-in-out both; transform-box: fill-box; transform-origin: 50% 100%; }
  .bird { animation: fly 9s linear infinite; }
  @keyframes look { 0%, 100% { transform: rotate(0) } 30%, 45% { transform: rotate(-18deg) translateY(-1px) } 65%, 80% { transform: rotate(10deg) } }
  @keyframes shrug { 0%, 100% { transform: translateY(0) } 40% { transform: translateY(-3px) } }
  @keyframes fly { from { transform: translate(-60px, 10px) } to { transform: translate(420px, -20px) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6ef"/><stop offset="1" stop-color="#eef3f1"/></linearGradient>
  <clipPath id="card"><rect width="360" height="240" rx="20"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="360" height="240" fill="url(#sky)"/>
  <!-- a blank wall: no holds, no bolts -->
  <path d="M120 20l80-14 90 10 40 24-10 200H110z" fill="#c8bba6"/>
  <path d="M120 20l80-14 10 70-60 40-30-30z" fill="#d6cbb8"/>
  <path d="M290 16l40 24-30 70-40-20z" fill="#bcae96"/>
  <path d="M0 200c60-6 120-2 180-4s120 2 180-2V240H0z" fill="#7d8f63"/>
  <path d="M0 212c80-6 160 2 240-4s80 2 120 0V240H0z" fill="#6a7c52"/>
  <path class="bird" d="M0 60c4-4 8-4 10 0 2-4 6-4 10 0" fill="none" stroke="#5b6670" stroke-width="1.6" stroke-linecap="round"/>
</g>

<!-- climber with a rope bag, looking at the empty wall -->
<g stroke-linecap="round" stroke-linejoin="round">
  <ellipse cx="66" cy="200" rx="16" ry="6" fill="#c25a36"/>
  <path d="M54 196c8-6 18-6 24 0" fill="none" stroke="#f07a3e" stroke-width="3"/>
  <g class="shrug">
    <path d="M96 168l-3 16 1 16M102 168l3 15-1 17" fill="none" stroke="#2b3440" stroke-width="7"/>
    <path d="M87 200h8M103 200h8" stroke="#d1495b" stroke-width="5"/>
    <path d="M89 168c-1-11 0-20 3-27h14c3 7 3 16 1 27z" fill="#1f93b0"/>
    <rect x="89" y="164" width="19" height="5" rx="2.4" fill="#ffc233"/>
    <path d="M92 146l-6 14M105 146l6 14" fill="none" stroke="#1f93b0" stroke-width="6"/>
    <g class="head">
      <circle cx="99" cy="132" r="7.5" fill="#e8b58f"/>
      <path d="M90.6 132a8.4 8.8 0 0 1 16.8 0z" fill="#ffc233"/>
    </g>
  </g>
</g>
</svg>
