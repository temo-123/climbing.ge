<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420" role="img" aria-label="Tie in first: the climber ties a figure-eight knot">
<!-- 401 "Tie in first" (sign in): at the base of the route the climber ties
     a figure-eight into the harness while the belayer waits with the device
     ready — hands work the knot, the loop of the eight grows and closes.
     climbing.ge scene set. -->
<style>
  .hands { animation: tie 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 0%; }
  .hands2 { animation: tie 1.8s ease-in-out -.9s infinite; transform-box: fill-box; transform-origin: 50% 0%; }
  .eight { animation: eight 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  .wait { animation: wait 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes tie { 0%, 100% { transform: rotate(0) } 50% { transform: rotate(-18deg) translateY(2px) } }
  @keyframes eight { 0% { transform: scale(.4) rotate(-20deg); opacity: .4 } 60%, 100% { transform: scale(1) rotate(0); opacity: 1 } }
  @keyframes wait { 0%, 60%, 100% { transform: rotate(0) } 75% { transform: rotate(-4deg) } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfe6ef"/><stop offset="1" stop-color="#eef3f1"/></linearGradient>
  <clipPath id="card"><rect width="360" height="420" rx="22"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="360" height="420" fill="url(#sky)"/>
  <path d="M0 110l40-30 30 18 40-40 34 30 30-20 50 36 40-26 46 32 50-34V200H0z" fill="#b9cdd4"/>
  <path d="M34 34l70-26 90 6 80-14 60 30 10 400H22z" fill="#c8bba6"/>
  <path d="M34 34l70-26 30 120-60 70-40-20z" fill="#d6cbb8"/>
  <path d="M194 14l80-14 60 30-40 110-90-20z" fill="#bcae96"/>
  <path d="M254 230l90-40-10 200-80-60z" fill="#b3a58c"/>
  <g fill-opacity=".9">
    <ellipse cx="200" cy="300" rx="6.5" ry="4.5" fill="#ff6a3d"/><ellipse cx="178" cy="262" rx="6.5" ry="4.5" fill="#3fb59a"/>
    <ellipse cx="208" cy="226" rx="6.5" ry="4.5" fill="#8a63e0"/><ellipse cx="184" cy="188" rx="6.5" ry="4.5" fill="#ffc233"/>
    <ellipse cx="214" cy="150" rx="6.5" ry="4.5" fill="#ff6a3d"/>
  </g>
  <path d="M0 372c60-8 120-2 180-6s120 2 180-2V420H0z" fill="#7d8f63"/>
  <path d="M0 384c80-6 160 2 240-4s80 2 120 0V420H0z" fill="#6a7c52"/>
</g>

<!-- rope: belayer's device → a pile on the ground → the climber's tie-in -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M128 330c4 20 14 34 34 36s40 0 50-2c14-2 10-10-4-10s-26 6-12 8M208 362c14-4 20-16 22-28" stroke="#7a2e1d" stroke-width="4.4"/>
  <path d="M128 330c4 20 14 34 34 36s40 0 50-2c14-2 10-10-4-10s-26 6-12 8M208 362c14-4 20-16 22-28" stroke="#f07a3e" stroke-width="2.8"/>
</g>

<!-- belayer, device ready, waiting -->
<g class="wait" stroke-linecap="round" stroke-linejoin="round">
  <path d="M117 336l-3 16 1 16M123 336l3 15-1 17" fill="none" stroke="#2b3440" stroke-width="7"/>
  <path d="M108 368h7M124 368h8" stroke="#2b3440" stroke-width="5"/>
  <path d="M110 336c-1-11 0-20 3-27h14c3 7 3 16 1 27z" fill="#c4532d"/>
  <rect x="110" y="332" width="19" height="5" rx="2.4" fill="#ffc233"/>
  <rect x="124" y="326" width="7" height="9" rx="2" fill="#3a4552"/>
  <path d="M113 314l-4 14M126 314l2 14" fill="none" stroke="#c4532d" stroke-width="5"/>
  <circle cx="120" cy="300" r="7.5" fill="#e8b58f"/>
  <path d="M111.6 300a8.4 8.8 0 0 1 16.8 0z" fill="#7a5bd6"/>
</g>

<!-- climber, tying in -->
<g stroke-linecap="round" stroke-linejoin="round">
  <path d="M226 336l-3 16 1 16M232 336l3 15-1 17" fill="none" stroke="#2b3440" stroke-width="7"/>
  <path d="M217 368h8M233 368h8" stroke="#d1495b" stroke-width="5"/>
  <path d="M219 336c-1-11 0-20 3-27h14c3 7 3 16 1 27z" fill="#1f93b0"/>
  <rect x="219" y="332" width="19" height="5" rx="2.4" fill="#ffc233"/>
  <!-- the figure-eight forming in front of the harness -->
  <g class="eight" fill="none" stroke-width="2.6">
    <path d="M230 334c-6-4-6-10 0-12s6 6 0 8-6 8 0 10" stroke="#f07a3e"/>
  </g>
  <path class="hands" d="M222 314l-2 12 8 6" fill="none" stroke="#1f93b0" stroke-width="6"/>
  <path class="hands2" d="M236 314l2 12-6 6" fill="none" stroke="#1f93b0" stroke-width="6"/>
  <circle cx="229" cy="302" r="7.5" fill="#e8b58f" transform="rotate(10 229 309)"/>
  <path d="M220.6 302a8.4 8.8 0 0 1 16.8 0z" fill="#ffc233" transform="rotate(10 229 309)"/>
</g>
</svg>
