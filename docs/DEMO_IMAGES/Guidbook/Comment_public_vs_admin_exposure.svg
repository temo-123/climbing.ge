<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" font-family="Arial,sans-serif">
<rect width="820" height="330" fill="white" />
<text x="410" y="24" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">get_article_comments (public, no auth) — user relation restricted to safe columns</text>

<rect x="20" y="45" width="250" height="118" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<text x="145" y="65" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">users (full row)</text>
<line x1="20" y1="75" x2="270" y2="75" stroke="#bbb" stroke-width="0.8" />
<text x="80" y="94.3" text-anchor="middle" font-size="10" fill="#444">id</text>
<text x="190" y="94.3" text-anchor="middle" font-size="10" fill="#444">name</text>
<line x1="20" y1="104" x2="270" y2="104" stroke="#ccc" stroke-width="0.8" />
<text x="80" y="120.3" text-anchor="middle" font-size="10" fill="#444">surname</text>
<text x="190" y="120.3" text-anchor="middle" font-size="10" fill="#444">image</text>
<line x1="20" y1="129" x2="270" y2="129" stroke="#ccc" stroke-width="0.8" />
<text x="80" y="146.3" text-anchor="middle" font-size="10" fill="#c62828" font-weight="bold">email</text>
<text x="190" y="146.3" text-anchor="middle" font-size="10" fill="#c62828" font-weight="bold">phone_number</text>
<line x1="145" y1="129" x2="145" y2="163" stroke="#ccc" stroke-width="0.8" />
<text x="145" y="158" text-anchor="middle" font-size="9" fill="#c62828">country, city, social_links, my_bio, …</text>

<line x1="270" y1="104" x2="340" y2="104" stroke="#555" stroke-width="1.5" />
<polygon points="340,104 331.97,108.07 331.38,101.42" fill="#555" />
<text x="305" y="97" text-anchor="middle" font-size="9" fill="#888">->select([...])</text>

<rect x="345" y="80" width="220" height="50" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<text x="455" y="99" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">Public API response</text>
<text x="455" y="116" text-anchor="middle" font-size="9.5" fill="#2e7d32">id, name, surname, image only</text>

<rect x="590" y="45" width="210" height="118" rx="6" fill="#f8cecc" stroke="#b85450" stroke-width="1.5" />
<text x="695" y="65" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">Before the fix</text>
<text x="695" y="86" text-anchor="middle" font-size="9.5" fill="#c62828">Full user object serialized</text>
<text x="695" y="102" text-anchor="middle" font-size="9.5" fill="#c62828">— email + phone_number</text>
<text x="695" y="118" text-anchor="middle" font-size="9.5" fill="#c62828">exposed to any anonymous</text>
<text x="695" y="134" text-anchor="middle" font-size="9.5" fill="#c62828">visitor on every article</text>
<text x="695" y="150" text-anchor="middle" font-size="9.5" fill="#c62828">comment thread</text>

<line x1="20" y1="200" x2="800" y2="200" stroke="#999" stroke-width="1" stroke-dasharray="4,4" />
<text x="410" y="222" text-anchor="middle" font-size="13" fill="#333" font-weight="bold">get_all_comments / get_all_review (admin moderation views) — route gated instead</text>

<rect x="20" y="240" width="250" height="70" rx="6" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.5" />
<text x="145" y="260" text-anchor="middle" font-size="12" fill="#222" font-weight="bold">article_comments</text>
<text x="145" y="278" text-anchor="middle" font-size="9.5" fill="#444">stores name/surname/email</text>
<text x="145" y="293" text-anchor="middle" font-size="9.5" fill="#444">directly on the row</text>

<line x1="270" y1="275" x2="340" y2="275" stroke="#555" stroke-width="1.5" />
<polygon points="340,275 331.97,279.07 331.38,272.42" fill="#555" />

<rect x="345" y="240" width="220" height="70" rx="6" fill="#fff2cc" stroke="#d6b656" stroke-width="1.5" />
<text x="455" y="262" text-anchor="middle" font-size="11" fill="#222" font-weight="bold">auth:sanctum middleware</text>
<text x="455" y="280" text-anchor="middle" font-size="9.5" fill="#7f6000">+ PermissionService::authorize</text>
<text x="455" y="296" text-anchor="middle" font-size="9.5" fill="#7f6000">('comment', 'show')</text>

<line x1="565" y1="275" x2="635" y2="275" stroke="#555" stroke-width="1.5" />
<polygon points="635,275 626.97,279.07 626.38,272.42" fill="#555" />

<rect x="640" y="240" width="160" height="70" rx="6" fill="#d5e8d4" stroke="#82b366" stroke-width="1.5" />
<text x="720" y="270" text-anchor="middle" font-size="10.5" fill="#222" font-weight="bold">Full row incl. email</text>
<text x="720" y="288" text-anchor="middle" font-size="9.5" fill="#2e7d32">only for a logged-in</text>
<text x="720" y="302" text-anchor="middle" font-size="9.5" fill="#2e7d32">admin with permission</text>
</svg>
